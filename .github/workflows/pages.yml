name: Deploy docs to Pages

on:
  # Yalnızca legal sayfalar (docs/) değişince deploy — uygulama-kodu
  # commit'leri (src/ vb.) Pages deploy'unu tetiklemesin.
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Settings'ten / Actions sekmesinden elle tetikleme (ilk kurulum + acil deploy).
  workflow_dispatch:

# GITHUB_TOKEN'a Pages'e deploy izni.
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy; devam eden deploy yarıda kesilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
