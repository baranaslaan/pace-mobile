<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  /* Cihaz fontu — offline, node_modules'tan (Chrome file:// erişir) */
  @font-face{font-family:'Outfit';font-weight:400;src:url('file:///Users/baranaslan/pace-mobile/node_modules/@expo-google-fonts/outfit/400Regular/Outfit_400Regular.ttf')}
  @font-face{font-family:'Outfit';font-weight:500;src:url('file:///Users/baranaslan/pace-mobile/node_modules/@expo-google-fonts/outfit/500Medium/Outfit_500Medium.ttf')}
  @font-face{font-family:'Outfit';font-weight:600;src:url('file:///Users/baranaslan/pace-mobile/node_modules/@expo-google-fonts/outfit/600SemiBold/Outfit_600SemiBold.ttf')}
  @font-face{font-family:'Outfit';font-weight:700;src:url('file:///Users/baranaslan/pace-mobile/node_modules/@expo-google-fonts/outfit/700Bold/Outfit_700Bold.ttf')}
  @font-face{font-family:'Outfit';font-weight:800;src:url('file:///Users/baranaslan/pace-mobile/node_modules/@expo-google-fonts/outfit/800ExtraBold/Outfit_800ExtraBold.ttf')}
  :root{
    --bg:#07090e; --sheet:#11141c; --input:#13161f;
    --tPrimary:#fff; --tSoft:rgba(255,255,255,.55); --tDim:rgba(255,255,255,.28);
    --tMute:rgba(255,255,255,.25); --tFaint:rgba(255,255,255,.2);
    --good:#3b82f6; --surface:rgba(255,255,255,.04); --hairline:rgba(255,255,255,.08);
    --market:#22c55e; --yemek:#f97316; --ulasim:#3b82f6; --kahve:#d4a373;
    --eglence:#a855f7; --fatura:#ef4444; --saglik:#14b8a6; --diger:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  html,body{background:var(--bg)}
  #root{position:relative;width:936px;height:1956px;background:var(--bg);overflow:hidden;
    font-family:'Outfit',system-ui,sans-serif;color:#fff}

  .sb{display:flex;justify-content:space-between;align-items:center;padding:40px 64px 0;font-size:30px;font-weight:600;color:#fff}
  .sb .r{display:flex;gap:14px;align-items:center;font-size:26px}

  .mock{position:absolute;inset:0;display:flex;flex-direction:column}
  .mock.home::after{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);
    width:1100px;height:620px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(59,130,246,.13),transparent 70%);pointer-events:none}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:64px 60px 0;z-index:1}
  .logo{font-size:54px;font-weight:800;letter-spacing:-1px}
  .logo .d{color:var(--good)}
  .more{font-size:60px;color:#fff;line-height:.5;letter-spacing:2px}

  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:96px;z-index:1}
  .ring{position:relative;width:600px;height:600px;display:flex;align-items:center;justify-content:center}
  .ring svg{position:absolute;transform:rotate(-90deg)}
  .ringtxt{display:flex;flex-direction:column;align-items:center;gap:8px}
  .ringtxt .k{font-size:26px;font-weight:600;color:var(--tMute);letter-spacing:3.5px}
  .ringtxt .v{font-size:150px;font-weight:800;letter-spacing:-5px;line-height:1.05}
  .ringtxt .u{font-size:32px;font-weight:500;color:var(--tMute)}
  .ringtxt .s{font-size:28px;font-weight:700;letter-spacing:2px;margin-top:14px;color:var(--good)}
  .stats{display:flex;align-items:center;gap:40px;width:700px}
  .stats .st{flex:1;text-align:center}
  .stats .st .v{font-size:56px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stats .st .l{font-size:25px;font-weight:600;color:var(--tFaint);letter-spacing:2.5px;margin-top:10px}
  .stats .sep{width:2px;height:80px;background:var(--hairline)}

  .inbar{background:rgba(59,130,246,.06);border-radius:70px 70px 0 0;padding:58px 60px 80px;z-index:1}
  .inlabel{font-size:32px;font-weight:600;color:var(--tDim);margin-bottom:36px}
  .inrow{display:flex;align-items:center;gap:24px;position:relative}
  .field{flex:1;display:flex;align-items:center}
  .field .pre{font-size:80px;font-weight:700;color:rgba(255,255,255,.22);margin-right:20px}
  .field .val{font-size:100px;font-weight:800;letter-spacing:-3px;color:rgba(255,255,255,.18)}
  .field .val.fill{color:#fff}
  .send{width:136px;height:136px;border-radius:68px;background:var(--good);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:64px;color:#fff;box-shadow:0 14px 50px rgba(59,130,246,.45)}
  .send.dim{opacity:.3;box-shadow:none}
  .chips{display:flex;gap:20px;margin-top:46px;overflow:hidden}
  .chip{display:flex;align-items:center;gap:18px;padding:22px 32px;border-radius:999px;border:2px solid var(--hairline);background:var(--surface);white-space:nowrap}
  .chip .dot{width:20px;height:20px;border-radius:50%;flex-shrink:0}
  .chip .nm{font-size:32px;font-weight:600;color:var(--tSoft)}
  .chip .am{font-size:32px;font-weight:700;color:var(--tSoft);font-variant-numeric:tabular-nums}
  .chip.on{border-color:var(--ulasim);background:rgba(59,130,246,.12)}
  .chip.on .nm{color:#fff}
  .note{margin-top:36px;padding:30px 36px;border-radius:30px;background:rgba(255,255,255,.05);font-size:34px;font-weight:500;color:var(--tDim)}

  .sheetmock{background:var(--sheet)}
  .sheetbody{padding:18px 60px 0}
  .grab{width:100px;height:11px;border-radius:99px;background:rgba(255,255,255,.15);margin:8px auto 40px}
  .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:50px}
  .shead .t{font-size:52px;font-weight:700;letter-spacing:-1px}
  .shead .x{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:38px;color:var(--tSoft)}
  .ssub{font-size:34px;color:var(--tSoft);margin-bottom:54px}
  .ssub b{font-weight:700;color:#fff}
  .ssub .sep{color:var(--tDim)}
  .slabel{font-size:26px;font-weight:600;color:var(--tDim);letter-spacing:2.5px;margin:0 4px 30px}

  .lrow{display:flex;align-items:center;gap:30px;background:var(--surface);border-radius:36px;padding:38px 42px;margin-bottom:24px}
  .lrow .dot{width:22px;height:22px;border-radius:50%;flex-shrink:0}
  .lrow .nm{flex:1}
  .lrow .nm b{display:block;font-size:40px;font-weight:600}
  .lrow .nm span{font-size:28px;color:var(--tSoft)}
  .lrow .am{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
  .lrow .tg{width:108px;height:62px;border-radius:99px;background:var(--good);position:relative;flex-shrink:0}
  .lrow .tg::after{content:"";position:absolute;top:7px;right:7px;width:48px;height:48px;border-radius:50%;background:#fff}
  .lrow .tg.off{background:rgba(255,255,255,.1)}
  .lrow .tg.off::after{right:auto;left:7px}
  .addrow{display:flex;gap:20px;margin-top:14px}
  .addrow .ni{flex:1;background:var(--input);border-radius:34px;padding:34px 38px;font-size:32px;color:var(--tDim);font-weight:500}
  .addrow .af{width:300px;background:var(--input);border-radius:34px;padding:34px 38px;font-size:32px;color:var(--tDim);font-weight:500;display:flex;gap:14px}

  .a3{display:flex;align-items:center;gap:30px;margin-bottom:50px}
  .a3 .st{flex:1;text-align:center;min-width:0}
  .a3 .st .v{font-size:50px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .a3 .st .l{font-size:24px;font-weight:600;color:var(--tFaint);letter-spacing:2px;margin-top:8px}
  .a3 .sep{width:2px;height:70px;background:var(--hairline)}
  .card{background:var(--surface);border-radius:44px;padding:48px;margin-bottom:30px}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}
  .card .big{font-size:64px;font-weight:800;letter-spacing:-1px}
  .card .cap2{font-size:26px;color:var(--tDim);font-weight:600;letter-spacing:1.5px;margin-top:8px}
  .tchip{padding:16px 30px;border-radius:999px;font-size:34px;font-weight:700;background:rgba(34,197,94,.14);color:#4ade80}
  .card .note{font-size:34px;color:var(--tSoft);line-height:1.45;margin-top:8px}
  .fcard{background:rgba(34,197,94,.08);border:2px solid rgba(34,197,94,.25);border-radius:44px;padding:48px;margin-bottom:30px}
  .fcard .h{font-size:30px;font-weight:600;color:var(--tDim);letter-spacing:1.5px;margin-bottom:22px}
  .fcard .b{font-size:46px;font-weight:600;line-height:1.4}
  .fcard .b b{color:#4ade80;font-weight:800}
  .bars{display:flex;align-items:flex-end;gap:18px;height:300px;margin-top:36px}
  .bars .bcol{flex:1;border-radius:14px 14px 5px 5px;background:rgba(255,255,255,.1)}
  .bars .bcol.hl{background:var(--good)}

  .prv{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 70px;z-index:1}
  .prv .ic{width:170px;height:170px;border-radius:50%;background:rgba(59,130,246,.14);display:flex;align-items:center;justify-content:center;font-size:80px;margin:0 auto 60px}
  .prv h3{font-size:72px;font-weight:800;letter-spacing:-1.5px;text-align:center;margin-bottom:80px}
  .prow{display:flex;align-items:center;gap:30px;background:var(--surface);border-radius:36px;padding:42px 44px;margin-bottom:22px}
  .prow .ck{color:var(--good);font-size:48px;font-weight:800}
  .prow .tx{font-size:40px;font-weight:600}
</style>
</head>
<body>
<div id="root"></div>
<script>
const T = {
  ring:{k:{tr:"KALAN",en:"LEFT"},u:{tr:"₺ / gün",en:"₺ / day"},s:{tr:"İYİ GİDİYOR",en:"ON TRACK"}},
  st:{spent:{tr:"HARCANAN",en:"SPENT"},limit:{tr:"LİMİT",en:"LIMIT"}},
  in:{prompt:{tr:"Bugün ne harcadın?",en:"What did you spend today?"},note:{tr:"Not ekle (opsiyonel)",en:"Add a note (optional)"}},
  cat:{market:{tr:"Market",en:"Groceries"},yemek:{tr:"Yemek",en:"Food"},ulasim:{tr:"Ulaşım",en:"Transit"},kahve:{tr:"Kahve",en:"Coffee"}},
  subs:{title:{tr:"Bütçe & Giderler",en:"Budget & Costs"},daily:{tr:"Günlük limitin",en:"Your daily limit"},reserved:{tr:"rezerve",en:"reserved"},list:{tr:"SABİT GİDERLER",en:"FIXED COSTS"},what:{tr:"Ne için?",en:"What for?"}},
  an:{title:{tr:"Tempo",en:"Pace"},spent:{tr:"HARCANAN",en:"SPENT"},avg:{tr:"GÜNLÜK ORT.",en:"DAILY AVG"},pool:{tr:"HAVUZ",en:"POOL"},weekly:{tr:"Haftalık tempo",en:"Weekly pace"},last7:{tr:"SON 7 GÜN",en:"LAST 7 DAYS"},fc:{tr:"AY SONU ÖNGÖRÜSÜ",en:"MONTH-END FORECAST"},
    fcbody:{tr:['Bu hızla ay sonunda elinde ','₺1.240',' kalır.'],en:['At this rate you end the month with ','₺1,240',' left.']},
    trend:{tr:["Geçen haftaya göre ","%18"," daha az harcadın 👏"],en:["You spent ","18%"," less than last week 👏"]}},
  rec:{title:{tr:"Tekrarlayanlar",en:"Recurring"},sched:{tr:"ZAMANLANMIŞ",en:"SCHEDULED"},name:{tr:"Ne için?",en:"What for?"},
    items:{tr:[["Aylık ulaşım","her ayın 1'i"],["Spor salonu","her ayın 10'u"],["Netflix","her ayın 22'si"],["iCloud","duraklatıldı"]],
           en:[["Monthly transit","1st of month"],["Gym","10th of month"],["Netflix","22nd of month"],["iCloud","paused"]]}},
  prv:{title:{tr:"Verin sende kalır",en:"Your data stays with you"},rows:{
    tr:["Hesap gerekmez","Reklam yok","İzleme / analitik yok","Tek dosyaya yedekle"],
    en:["No account needed","No ads","No tracking or analytics","Back up to one file"]}},
};
let LANG='tr';
const L=k=>k[LANG];
function ringSvg(ratio,color){const r=265,c=2*Math.PI*r,off=c*(1-ratio);
  return `<svg width="600" height="600" viewBox="0 0 600 600">
    <circle cx="300" cy="300" r="${r}" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="30"/>
    <circle cx="300" cy="300" r="${r}" fill="none" stroke="${color}" stroke-width="30" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;}
const sb=`<div class="sb"><span>9:41</span><span class="r">●●● 100%</span></div>`;
const header=()=>`<div class="hd"><span class="logo">pace<span class="d">.</span></span><span class="more">⋯</span></div>`;

function homeScreen(filled){
  const chips = filled
    ? `<div class="chips">
        <div class="chip"><span class="dot" style="background:var(--market)"></span><span class="nm">${L(T.cat.market)}</span></div>
        <div class="chip"><span class="dot" style="background:var(--yemek)"></span><span class="nm">${L(T.cat.yemek)}</span></div>
        <div class="chip on"><span class="dot" style="background:var(--ulasim)"></span><span class="nm">${L(T.cat.ulasim)}</span></div>
        <div class="chip"><span class="dot" style="background:var(--kahve)"></span><span class="nm">${L(T.cat.kahve)}</span></div></div>
       <div class="note">${L(T.in.note)}</div>`
    : `<div class="chips">
        <div class="chip"><span class="dot" style="background:var(--kahve)"></span><span class="nm">${L(T.cat.kahve)}</span><span class="am">₺65</span></div>
        <div class="chip"><span class="dot" style="background:var(--market)"></span><span class="nm">${L(T.cat.market)}</span><span class="am">₺450</span></div>
        <div class="chip"><span class="dot" style="background:var(--yemek)"></span><span class="nm">${L(T.cat.yemek)}</span><span class="am">₺145</span></div></div>`;
  return `${sb}<div class="mock home">${header()}
    <div class="center">
      <div class="ring">${ringSvg(.62,'#3b82f6')}
        <div class="ringtxt"><div class="k">${L(T.ring.k)}</div>
          <div class="v">${filled?'255':'340'}</div><div class="u">${L(T.ring.u)}</div>
          <div class="s">${L(T.ring.s)}</div></div></div>
      <div class="stats">
        <div class="st"><div class="v">${filled?'₺295':'₺210'}</div><div class="l">${L(T.st.spent)}</div></div>
        <div class="sep"></div>
        <div class="st"><div class="v">₺550</div><div class="l">${L(T.st.limit)}</div></div></div>
    </div>
    <div class="inbar">
      <div class="inlabel">${L(T.in.prompt)}</div>
      <div class="inrow"><div class="field"><span class="pre">₺</span><span class="val${filled?' fill':''}">${filled?'85':'0'}</span></div>
        <div class="send${filled?'':' dim'}">↑</div></div>
      ${chips}
    </div></div>`;
}
function sheetScreen(title,body){
  return `${sb}<div class="mock sheetmock"><div class="sheetbody"><div class="grab"></div>
      <div class="shead"><div class="t">${title}</div><div class="x">✕</div></div>${body}</div></div>`;
}
const SCREENS = {
  1:()=>homeScreen(false),
  2:()=>homeScreen(true),
  3:()=>sheetScreen(L(T.subs.title),
      `<div class="ssub">${L(T.subs.daily)} <b>₺550</b> <span class="sep">•</span> ${L(T.subs.reserved)} <b>₺8.209</b></div>
       <div class="slabel">${L(T.subs.list)}</div>
       <div class="lrow"><div class="nm"><b>Kira</b></div><div class="am">₺6.000</div></div>
       <div class="lrow"><div class="nm"><b>Spotify</b></div><div class="am">₺59</div></div>
       <div class="lrow"><div class="nm"><b>Kredi taksiti</b></div><div class="am">₺2.150</div></div>
       <div class="lrow"><div class="nm"><b>iCloud</b></div><div class="am">₺39</div></div>
       <div class="addrow"><div class="ni">${L(T.subs.what)}</div><div class="af"><span style="color:var(--tMute)">₺</span> 0</div></div>`),
  4:()=>sheetScreen(L(T.an.title),
      `<div class="a3">
        <div class="st"><div class="v">₺8.420</div><div class="l">${L(T.an.spent)}</div></div><div class="sep"></div>
        <div class="st"><div class="v">₺372</div><div class="l">${L(T.an.avg)}</div></div><div class="sep"></div>
        <div class="st"><div class="v">₺16.600</div><div class="l">${L(T.an.pool)}</div></div></div>
       <div class="fcard"><div class="h">${L(T.an.fc)}</div>
        <div class="b">${T.an.fcbody[LANG][0]}<b>${T.an.fcbody[LANG][1]}</b>${T.an.fcbody[LANG][2]}</div></div>
       <div class="card"><div class="top"><div><div class="big">₺2.610</div><div class="cap2">${L(T.an.last7)}</div></div>
        <div class="tchip">%18 ↓</div></div>
        <div class="note">${T.an.trend[LANG][0]}<b style="color:#4ade80">${T.an.trend[LANG][1]}</b>${T.an.trend[LANG][2]}</div></div>
       <div class="card"><div class="cap2" style="margin:0 0 6px">${L(T.an.weekly).toUpperCase()}</div>
        <div class="bars">
          <div class="bcol" style="height:48%"></div><div class="bcol" style="height:62%"></div>
          <div class="bcol hl" style="height:80%"></div><div class="bcol" style="height:40%"></div>
          <div class="bcol" style="height:55%"></div><div class="bcol" style="height:35%"></div>
          <div class="bcol hl" style="height:70%"></div></div></div>`),
  5:()=>{const it=T.rec.items[LANG];const colors=['--ulasim','--saglik','--eglence','--diger'];
      const rows=it.map((r,i)=>`<div class="lrow"><span class="dot" style="background:var(${colors[i]})"></span><div class="nm"><b>${r[0]}</b><span>${r[1]}</span></div><div class="tg${i===3?' off':''}"></div></div>`).join('');
      return sheetScreen(L(T.rec.title),
      `<div class="slabel">${L(T.rec.sched)}</div>${rows}
       <div class="addrow"><div class="ni">${L(T.rec.name)}</div><div class="af"><span style="color:var(--tMute)">₺</span> 0</div></div>`);},
  6:()=>`${sb}<div class="mock home">${header()}
    <div class="prv"><div class="ic">🔒</div><h3>${L(T.prv.title)}</h3>
      ${T.prv.rows[LANG].map(r=>`<div class="prow"><span class="ck">✓</span><span class="tx">${r}</span></div>`).join('')}
    </div></div>`,
};
const m=(location.hash||'#tr-1').slice(1).split('-');
LANG = m[0]==='en' ? 'en' : 'tr';
const n = Math.max(1,Math.min(6,parseInt(m[1]||'1',10)));
document.getElementById('root').innerHTML = SCREENS[n]();
document.documentElement.setAttribute('data-ready','1');
</script>
</body>
</html>
